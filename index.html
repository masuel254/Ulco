<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes ULCO</title>
<meta name="theme-color" content="#12355b">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#16202c; --mute:#66758a; --line:#e2e7ee;
  --brand:#12355b; --accent:#ffd166; --good:#1f8a5b; --mid:#b7791f; --bad:#c0392b; --new:#d6336c;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f141b; --card:#18202a; --ink:#e8edf3; --mute:#94a3b5; --line:#263140;
    --good:#4cc38a; --mid:#e0a84a; --bad:#f07167; --new:#ff7aa8; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.bar{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.bar h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
.bar h1 small{display:block;font-weight:400;font-size:13px;opacity:.8}
button{font:inherit;cursor:pointer}
.ib{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;padding:7px 11px;font-size:14px}
.ib:active{background:rgba(255,255,255,.15)}
.ib[disabled]{opacity:.5}
main{max-width:760px;margin:0 auto;padding:14px 12px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:12px}
select{font:inherit;font-size:14px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--mute);display:block;margin-top:4px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero div{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero span{font-size:14px;color:var(--mute)}
.hero b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.latest{background:var(--card);border:2px solid var(--brand);border-radius:14px;padding:12px 14px 6px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.latest{border-color:#4a78a8}}
.latest h2{margin:0 0 6px;font-size:15px}
.latest ul{list-style:none;margin:0;padding:0}
.latest li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.latest li:first-child{border-top:0}
.latest li.isnew{background:color-mix(in srgb,var(--new) 9%,transparent);margin:0 -14px;padding:9px 14px}
.latest .ln{flex:1;min-width:0}
.latest .ln b{font-size:15px;font-weight:600}
.latest .ln small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.latest .lv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);padding:8px;border-radius:9px;font-size:14.5px}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff}
.ue{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ue>h2{margin:0;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.ue>h2 span{flex:1}
.avg{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.g{color:var(--good)} .m{color:var(--mid)} .b{color:var(--bad)} .n{color:var(--mute);font-weight:400}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .code{font-size:12px;color:var(--mute);min-width:62px}
summary .nom{flex:1;font-size:14.5px}
summary .coef{font-size:12px;color:var(--mute);white-space:nowrap}
.empty summary{cursor:default;opacity:.55}
.evals{margin:0;padding:0 14px 10px 86px;list-style:none}
.evals li,.flat li{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:14px;border-top:1px dashed var(--line)}
.evals li .t,.flat li .t{flex:1}
.d{color:var(--mute);font-size:12.5px;white-space:nowrap}
.badge{background:var(--new);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 7px;margin-left:6px;vertical-align:middle;font-weight:600}
.flat{list-style:none;margin:0;padding:4px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.flat li:first-child{border-top:0}
.flat .t small{display:block;color:var(--mute);font-size:12.5px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.msg.err{border-color:var(--bad)}
.msg p{margin:0 0 8px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,460px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
dialog input{width:100%;font:inherit;font-size:14px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pb{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px}
.sb{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px}

.upd{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.upd small{color:var(--mute)}
footer{max-width:760px;margin:6px auto 0;padding:0 14px;color:var(--mute);font-size:12px}
@media (max-width:480px){ .evals{padding-left:14px} summary .code{min-width:50px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Notes ULCO<small id="who">Relevé de notes</small></h1>
    <button class="ib" id="refresh" aria-label="Actualiser">Actualiser</button>
    <button class="ib" id="cfg" aria-label="Réglages">Réglages</button>
  </div>
</header>
<main>
  <div class="meta"><select id="sem" hidden aria-label="Semestre"></select><span id="stamp"></span></div>
  <div id="alert"></div>
  <div id="content"></div>
</main>
<footer>Notes indicatives, non définitives. Ceci n'est pas un bulletin officiel. <span id="fver"></span></footer>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h3 style="margin:0 0 12px">Réglages</h3>
    <label for="hook">Adresse du relais n8n (webhook)</label>
    <input id="hook" type="url" inputmode="url" placeholder="https://…/webhook/ulco-notes-…" autocomplete="off">
    <div class="upd">
      <span>Pastille nouvelles notes<br><small id="pushmsg"></small></span>
      <button class="sb" type="button" id="push">Activer</button>
    </div>
    <div class="upd">
      <span>Version <b id="ver"></b><br><small id="updmsg"></small></span>
      <button class="sb" type="button" id="upd">Rechercher une mise à jour</button>
    </div>
    <div class="row">
      <button class="sb" value="cancel" formnovalidate>Annuler</button>
      <button class="pb" value="ok">Enregistrer</button>
    </div>
  </form>
</dialog>

<script type="module">
import { parseBulletin, listSemesters } from './parse.js?v=1.4.0';

const APP_VERSION = '1.4.0';
const VAPID_PUBLIQUE = 'BAX2JtcRw3vXUI8jQuDVtKjqXcELJYl-NY0SaA8AxoQ-94jIrPLmC7NddW5KDhfV5qGogXOuz4ArQ_qiWsfQbhU';

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const NEW_TTL = 48 * 3600 * 1000;
let state = store.get('ulco.data', null);   // { at, sem, semesters, bulletin }
let view = store.get('ulco.view', 'ue');

// Configuration en un clic : .../Ulco/#hook=https://...
function readHash() {
  const m = location.hash.match(/hook=([^&]+)/);
  if (!m) return false;
  store.set('ulco.hook', decodeURIComponent(m[1]).trim());
  history.replaceState(null, '', location.pathname);
  return true;
}
readHash();

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => (n === null || n === undefined ? '~' : n.toFixed(2).replace('.', ','));
const cls = (n) => (n === null || n === undefined ? 'n' : n >= 12 ? 'g' : n >= 10 ? 'm' : 'b');
const fdate = (d) => (d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '');
const keyOf = (sem, ue, mod, e) => [sem, ue.titre.slice(0, 6), mod.code, e.date, e.nom, e.note].join('|');

function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return 'le ' + new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

// Moyenne pondérée : [[valeur, coef], ...], valeurs absentes ignorées.
function wavg(pairs) {
  let n = 0, d = 0;
  for (const [v, c] of pairs) if (v !== null && v !== undefined && c) { n += v * c; d += c; }
  return d ? n / d : null;
}
// Même logique que ScoDoc : module = évaluations pondérées, UE = modules pondérés,
// générale = moyenne des UE (UE de poids égal).
function averages(b) {
  const ues = b.ues.map((ue) => {
    const mods = ue.modules.map((m) => m.moyenne ?? wavg(m.evaluations.map((e) => [e.note, e.coef])));
    const calc = wavg(ue.modules.map((m, i) => [mods[i], m.coef]));
    const coefs = ue.modules.reduce((t, m, i) => t + (mods[i] !== null ? m.coef || 0 : 0), 0);
    return { moyenne: ue.moyenne ?? calc, coefs };
  });
  const ok = ues.filter((u) => u.moyenne !== null);
  return { ues, generale: ok.length ? ok.reduce((t, u) => t + u.moyenne, 0) / ok.length : null, nUe: ok.length };
}

function allEvals(b, sem) {
  const out = [];
  for (const ue of b.ues) for (const mod of ue.modules) for (const e of mod.evaluations) {
    if (e.note !== null) out.push({ ...e, ue, mod, key: keyOf(sem, ue, mod, e) });
  }
  return out;
}

function trackNew(b, sem) {
  const seen = store.get('ulco.seen', null);
  const fresh = store.get('ulco.new', {});
  const keys = allEvals(b, sem).map((e) => e.key);
  const now = Date.now();
  if (seen) for (const k of keys) if (!seen.includes(k)) fresh[k] = now;
  for (const k of Object.keys(fresh)) if (now - fresh[k] > NEW_TTL) delete fresh[k];
  store.set('ulco.new', fresh);
  store.set('ulco.seen', [...new Set([...(seen || []), ...keys])]);
}

function render() {
  const hook = store.get('ulco.hook', '');
  const c = $('content');
  if (!state) {
    $('who').textContent = 'Relevé de notes';
    $('stamp').textContent = '';
    $('sem').hidden = true;
    c.innerHTML = hook
      ? '<div class="msg"><p>Chargement des notes…</p></div>'
      : '<div class="msg"><p><b>Relais non configuré.</b></p><p>Ouvrez Réglages et collez l\'adresse du webhook n8n. Les notes s\'afficheront ensuite ici.</p></div>';
    return;
  }
  const b = state.bulletin;
  const fresh = store.get('ulco.new', {});
  const badge = (k) => (fresh[k] ? '<span class="badge">nouveau</span>' : '');
  $('who').textContent = [b.etudiant, b.intitule].filter(Boolean).join(' · ');
  $('stamp').textContent = 'Actualisé ' + ago(state.at);

  const sel = $('sem');
  sel.hidden = state.semesters.length < 2;
  sel.innerHTML = state.semesters.map((s) => `<option value="${esc(s.id)}"${s.id === state.sem ? ' selected' : ''}>${esc(s.label)}</option>`).join('');

  const evals = allEvals(b, state.sem);
  const av = averages(b);
  let html = `<div class="hero"><div><span>Moyenne générale</span><b class="${cls(av.generale)}">${fmt(av.generale)}</b></div>
</div>`;
  // Les 5 dernières notes, mises en avant sous la moyenne générale.
  const latest = [...new Map(evals.map((e) => [[e.mod.code, e.date, e.nom, e.note].join('|'), e])).values()]
    .sort((a, z) => (z.date || '').localeCompare(a.date || '')).slice(0, 5);
  if (latest.length) {
    html += '<section class="latest"><h2>Dernières notes</h2><ul>' + latest.map((e) => `<li class="${fresh[e.key] ? 'isnew' : ''}">
      <span class="ln"><b>${esc(e.mod.nom)}</b>${badge(e.key)}<small>${fdate(e.date)} · ${esc(e.nom || e.mod.code)} · coef ${e.coef ?? '?'}</small></span>
      <span class="lv ${cls(e.note)}">${fmt(e.note)}</span></li>`).join('') + '</ul></section>';
  }
  html += '<div class="tiles">';
  b.ues.forEach((ue, i) => {
    html += `<div class="tile"><b class="${cls(av.ues[i].moyenne)}">${fmt(av.ues[i].moyenne)}</b><span>${esc(ue.titre.split(' - ')[0])}</span></div>`;
  });
  html += `<div class="tile"><b>${evals.length}</b><span>note${evals.length > 1 ? 's' : ''} publiée${evals.length > 1 ? 's' : ''}</span></div></div>`;
  html += `<div class="tabs" role="tablist">
    <button role="tab" data-v="ue" aria-selected="${view === 'ue'}">Par UE</button>
    <button role="tab" data-v="date" aria-selected="${view === 'date'}">Dernières notes</button></div>`;

  if (view === 'ue') {
    for (const ue of b.ues) {
      html += `<section class="ue"><h2><span>${esc(ue.titre)}</span><span class="avg ${cls(ue.moyenne)}">${fmt(ue.moyenne)}</span></h2>`;
      for (const mod of ue.modules) {
        const has = mod.evaluations.length > 0;
        const isNew = mod.evaluations.some((e) => fresh[keyOf(state.sem, ue, mod, e)]);
        html += `<details class="${has ? '' : 'empty'}"${isNew ? ' open' : ''}><summary>
          <span class="code">${esc(mod.code)}</span><span class="nom">${esc(mod.nom)}${isNew ? '<span class="badge">nouveau</span>' : ''}</span>
          <span class="coef">coef ${mod.coef ?? '?'}</span><span class="avg ${cls(mod.moyenne)}">${fmt(mod.moyenne)}</span></summary>`;
        if (has) {
          html += '<ul class="evals">' + mod.evaluations.map((e) => `<li><span class="d">${fdate(e.date)}</span>
            <span class="t">${esc(e.nom || 'Évaluation')}${badge(keyOf(state.sem, ue, mod, e))}</span>
            <span class="d">coef ${e.coef ?? '?'}</span>
            <span class="avg ${cls(e.note)}">${e.note === null ? 'en attente' : fmt(e.note)}</span></li>`).join('') + '</ul>';
        }
        html += '</details>';
      }
      html += '</section>';
    }
  } else {
    // Un module rattaché à plusieurs UE ne doit apparaître qu'une fois ici.
    const uniq = new Map();
    for (const e of evals) uniq.set([e.mod.code, e.date, e.nom, e.note].join('|'), e);
    const list = [...uniq.values()].sort((a, z) => (z.date || '').localeCompare(a.date || ''));
    html += list.length
      ? '<ul class="flat">' + list.map((e) => `<li><span class="d">${fdate(e.date)}</span>
          <span class="t">${esc(e.mod.nom)}${badge(e.key)}<small>${esc(e.mod.code)} · ${esc(e.nom || 'Évaluation')} · coef ${e.coef ?? '?'}</small></span>
          <span class="avg ${cls(e.note)}">${fmt(e.note)}</span></li>`).join('') + '</ul>'
      : '<div class="msg"><p>Aucune note publiée pour ce semestre.</p></div>';
  }
  c.innerHTML = html;
}

function alertMsg(text) {
  $('alert').innerHTML = text ? `<div class="msg err"><p>${esc(text)}</p></div>` : '';
}

async function load(sem) {
  const hook = store.get('ulco.hook', '');
  if (!hook) { render(); return; }
  const btn = $('refresh');
  btn.disabled = true; btn.textContent = '…';
  try {
    const url = new URL(hook);
    if (sem !== undefined && sem !== null) url.searchParams.set('sem', sem);
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`Le relais a répondu ${r.status}.`);
    const html = await r.text();
    if (/tudiant inconnu/.test(html.replace(/&eacute;/g, 'é'))) throw new Error('Numéro INE inconnu du site ULCO. Vérifiez-le dans le workflow n8n.');
    const bulletin = parseBulletin(html);
    if (!bulletin.ues.length) throw new Error("La réponse ne contient pas de relevé. Le site ULCO a peut-être changé ou est indisponible.");
    const semesters = listSemesters(html);
    const cur = sem ?? (semesters.find((s) => s.selected) || semesters[0] || { id: '0' }).id;
    trackNew(bulletin, cur);
    state = { at: Date.now(), sem: String(cur), semesters, bulletin };
    store.set('ulco.data', state);
    alertMsg('');
  } catch (e) {
    const offline = e instanceof TypeError;
    alertMsg((offline ? `Relais injoignable. Adresse utilisée : ${hook}. Vérifiez-la dans Réglages (elle doit contenir /webhook/ et non /webhook-test/).` : e.message) +
      (state ? ' Affichage des dernières notes enregistrées.' : ''));
  } finally {
    btn.disabled = false; btn.textContent = 'Actualiser';
    render();
  }
}

$('refresh').onclick = () => load(state?.sem);
$('sem').onchange = (e) => load(e.target.value);
$('content').addEventListener('click', (e) => {
  const t = e.target.closest('[data-v]');
  if (t) { view = t.dataset.v; store.set('ulco.view', view); render(); }
  if (e.target.closest('.empty summary')) e.preventDefault();
});
// Versions : version.json est lu sans cache sur GitHub Pages.
$('ver').textContent = APP_VERSION;
$('fver').textContent = 'v' + APP_VERSION;
const newer = (a, b) => {
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
};
async function checkUpdate(manual) {
  const msg = $('updmsg');
  if (manual) msg.textContent = 'Recherche…';
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const v = await r.json();
    if (!newer(v.version, APP_VERSION)) { if (manual) msg.textContent = 'Vous avez la dernière version.'; return; }
    msg.textContent = `Mise à jour ${v.version} trouvée, installation…`;
    if (!manual && !confirmUpdate(v)) return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.update().catch(() => {});
    if (window.caches) for (const k of await caches.keys()) if (k.startsWith('ulco-v')) await caches.delete(k);
    location.reload();
  } catch {
    if (manual) msg.textContent = 'Impossible de joindre GitHub. Réessayez plus tard.';
  }
}
function confirmUpdate(v) {
  $('alert').innerHTML = `<div class="msg"><p>Nouvelle version ${esc(v.version)} disponible${v.notes ? ' : ' + esc(v.notes) : ''}.</p>
    <button class="pb" id="doupd">Mettre à jour</button></div>`;
  $('doupd').onclick = () => checkUpdate(true);
  return false;
}
$('upd').onclick = () => checkUpdate(true);

// ---- Pastille : abonnement push, géré par le workflow n8n "Alertes Notes ULCO" ----
const b64uToBytes = (s) => {
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
  return Uint8Array.from(b, (c) => c.charCodeAt(0));
};
const bytesToB64u = (str) => btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

async function pushStatus() {
  const msg = $('pushmsg'), btn = $('push');
  if (!pushSupported()) {
    msg.textContent = isIOS() && !standalone()
      ? "Installez d'abord l'appli : Partager, puis Sur l'écran d'accueil, et ouvrez-la depuis l'icône."
      : 'Non disponible sur cet appareil.';
    btn.disabled = true; return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  btn.disabled = false;
  if (sub && Notification.permission === 'granted') { msg.textContent = 'Activée. Vérification à 8 h, 12 h, 17 h et 21 h.'; btn.textContent = 'Réactiver'; }
  else if (Notification.permission === 'denied') { msg.textContent = 'Refusée. Autorisez-la dans Réglages iPhone > Notifications > Notes ULCO.'; btn.textContent = 'Activer'; }
  else { msg.textContent = 'Désactivée.'; btn.textContent = 'Activer'; }
}

async function enablePush() {
  const msg = $('pushmsg');
  const hook = store.get('ulco.hook', '');
  if (!/ulco-notes-/.test(hook)) { msg.textContent = "Configurez d'abord l'adresse du relais."; return; }
  try {
    // La demande d'autorisation doit partir directement du geste de l'utilisateur.
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { msg.textContent = 'Autorisation refusée.'; return; }
    msg.textContent = 'Abonnement…';
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const key = b64uToBytes(VAPID_PUBLIQUE);
    if (sub) {
      const cur = sub.options && sub.options.applicationServerKey;
      if (cur && bytesToB64u(String.fromCharCode(...new Uint8Array(cur))) !== VAPID_PUBLIQUE) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const cfg = await caches.open('ulco-cfg');
    await cfg.put('test-pending', new Response('1'));
    const url = new URL(hook.replace('ulco-notes-', 'ulco-push-'));
    url.searchParams.set('s', bytesToB64u(JSON.stringify(sub.toJSON())));
    const r = await fetch(url, { cache: 'no-store' });
    const t = await r.text();
    if (!r.ok || t.trim() !== 'ok') throw new Error(r.ok ? t : 'n8n a répondu ' + r.status + '. Le workflow « Alertes Notes ULCO » est-il activé ?');
    msg.textContent = 'Activée. Une notification de test arrive dans quelques secondes.';
    $('push').textContent = 'Réactiver';
  } catch (e) {
    msg.textContent = e instanceof TypeError ? "n8n injoignable. Le workflow « Alertes Notes ULCO » est-il activé ?" : e.message;
  }
}
$('push').onclick = enablePush;

async function clearBadge() {
  try { if (navigator.clearAppBadge) await navigator.clearAppBadge(); } catch {}
  try { const cfg = await caches.open('ulco-cfg'); await cfg.delete('badge'); } catch {}
}
clearBadge();
document.addEventListener('visibilitychange', () => { if (!document.hidden) clearBadge(); });
checkUpdate(false);

$('cfg').onclick = () => { $('hook').value = store.get('ulco.hook', ''); $('dlg').showModal(); pushStatus().catch(() => {}); };
$('dlg').addEventListener('close', () => {
  if ($('dlg').returnValue !== 'ok') return;
  store.set('ulco.hook', $('hook').value.trim());
  load();
});
window.addEventListener('hashchange', () => { if (readHash()) load(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state && Date.now() - state.at > 15 * 60000) load(state.sem);
});

render();
load(state?.sem);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
